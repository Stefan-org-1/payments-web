name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    uses: Stefan-org-1/ci-templates/.github/workflows/node-build.yml@v2
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      node-version: "22"

  # Team-owned job, no DevOps involvement.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm run lint

  deploy:
    needs: [build, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: Stefan-org-1/ci-templates/.github/workflows/deploy.yml@v1
    with:
      environment: prod
